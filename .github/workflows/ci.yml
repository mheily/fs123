name: CI

on:
  push:
    branches: [ rust-rewrite ]
  pull_request:
    branches: [ rust-rewrite ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FUSE and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse-dev python3 python3-pip python3-venv

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Unit Tests
        run: cargo test --workspace

      - name: Run Integration Tests (Rust & Python)
        run: |
          cargo build --workspace
          python3 scripts/run_integration_tests.py
