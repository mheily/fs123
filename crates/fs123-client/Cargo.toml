[package]
name = "fs123-fuse"
version = "0.1.0"
edition = "2021"
description = "fs123 FUSE filesystem client"

[[bin]]
name = "fs123-mount"
path = "src/main.rs"

[dependencies]
fs123-core = { path = "../../crates/fs123-core" }
fuser = "0.15"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
