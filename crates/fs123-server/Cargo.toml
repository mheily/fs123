[package]
name = "fs123-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "fs123_server"
path = "src/lib.rs"

[[bin]]
name = "fs123-server"
path = "src/main.rs"

[dependencies]
fs123-core = { path = "../fs123-core" }
actix-web = "4"
actix-rt = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
url = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }

[features]
default = []
database = ["sqlx"]

[dev-dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1"
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process"] }
